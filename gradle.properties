# --- Gradle ---
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# Gradle 데몬은 JDK 21 로 뜬다 — 기본 JDK 가 25 인 머신에서 AGP/Kotlin 툴체인이 거부하기 때문이다.
# 경로를 박지 않고 gradle/gradle-daemon-jvm.properties 의 기준(toolchainVersion=21)으로
# 설치된 JDK 를 찾게 한다. 예전에는 org.gradle.java.home 에 이 머신의 경로를 박아 둬서
# 다른 머신(과 그 머신의 Xcode 빌드 단계)에서는 빌드가 시작되지도 않았다.

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- Kotlin ---
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
