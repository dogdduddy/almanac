# XcodeGen 정의. `xcodegen generate` 로 Almanac.xcodeproj 를 만든다.
#
# project.pbxproj 를 손으로 관리하지 않는 이유: 병합 충돌이 잦고 리뷰가 불가능하다.
# 나중에 WidgetKit 익스텐션 타깃을 붙일 때도 여기 몇 줄이면 된다.
#
# 생성물(.xcodeproj)은 커밋하지 않는다 — 이 파일이 진실의 원천이다.

name: Almanac

options:
  bundleIdPrefix: com.dogdduddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # Gradle 을 빌드 페이즈에서 돌려야 한다
    DEVELOPMENT_TEAM: ""                # 시뮬레이터 빌드에는 불필요. 실기기 배포 시 채운다

targets:
  Almanac:
    type: application
    platform: iOS

    sources:
      - path: Almanac
        excludes:
          - "Resources/**"
      # 구운 content.db. bakeContent → syncContentToIos 가 채운다.
      # 없으면 앱은 빌드되지만 첫 실행에서 문장을 못 찾는다.
      #
      # type: folder 로 두면 안 된다 — Xcode 가 폴더 참조를 중첩 코드 객체로 보고
      # 코드서명 단계에서 "code object is not signed at all" 로 실패한다.
      # 리소스 빌드 페이즈로 명시해야 한다.
      - path: Almanac/Resources
        buildPhase: resources
        optional: true

    info:
      path: Almanac/Info.plist
      properties:
        CFBundleDisplayName: Almanac
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose Multiplatform 필수. 없으면 앱이 **시작하자마자 예외로 죽는다**
        # (경고가 아니라 IllegalStateException 이다).
        # 이게 없으면 120Hz 기기에서 60Hz 로 묶여 애니메이션이 눈에 띄게 끊긴다 —
        # 역방향 페이지 넘김이 이 앱의 핵심 연출이므로 특히 중요하다.
        CADisableMinimumFrameDurationOnPhone: true
        # 위치는 선택 사항이다. 거부해도 도시를 직접 고르면 앱이 온전히 동작한다.
        NSLocationWhenInUseUsageDescription: >-
          Almanac uses your location only to look up today's weather,
          so it can find a passage written about the same sky.

    dependencies:
      # 앱이 익스텐션을 품는다. XcodeGen 이 embed 빌드 페이즈를 만들어준다.
      - target: AlmanacWidget

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogdduddy.almanac
        CODE_SIGN_ENTITLEMENTS: Almanac/Almanac.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
          # SQLDelight 의 네이티브 드라이버(sqliter)는 시스템 sqlite3 를 호출만 하고
          # 자기가 품고 있지 않다. 이걸 빼면 링크 단계에서 _sqlite3_* 전부 미해결로 터진다.
          - -lsqlite3
        # 서명을 끄면(CODE_SIGNING_REQUIRED: NO) Xcode 가 엔타이틀먼트 처리 단계를
        # 통째로 건너뛴다. 그러면 App Group 이 안 붙고, 증상은 "컨테이너 조회가 nil" 로
        # 나타나 DB 가 앱 전용 경로에 생긴다. 시뮬레이터 기본 ad-hoc 서명에 맡긴다.

    preBuildScripts:
      - name: Compile Kotlin framework
        # KMP 표준 태스크. Xcode 가 넘겨주는 CONFIGURATION/SDK_NAME/ARCHS 를 읽어
        # 맞는 아키텍처로 빌드하고 결과를 xcode-frameworks 에 놓는다.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

  AlmanacWidget:
    type: app-extension
    platform: iOS

    sources:
      - path: AlmanacWidget
        excludes:
          - "Resources/**"
      # 위젯은 자기 번들을 본다 (익스텐션의 NSBundle.mainBundle 은 앱 번들이 아니다).
      # content.db 를 여기에도 넣어야 앱을 한 번도 안 열었어도 위젯이 동작한다.
      - path: AlmanacWidget/Resources
        buildPhase: resources
        optional: true

    info:
      path: AlmanacWidget/Info.plist
      properties:
        CFBundleDisplayName: Almanac
        # 앱과 버전이 같아야 한다. 다르면 content.db 복사 판단(버전 스탬프)이
        # 서로 어긋나 앱과 위젯이 번갈아 재복사한다.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogdduddy.almanac.widget
        CODE_SIGN_ENTITLEMENTS: AlmanacWidget/AlmanacWidget.entitlements
        # 위젯은 Compose 를 링크하지 않는다 — 익스텐션은 메모리 한도가 빡빡한데
        # Compose 를 통째로 들고 갈 이유가 없다. 도메인 로직만 있는 AlmanacKit 이면 된다.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - AlmanacKit
          - -lsqlite3
        # 서명을 끄면(CODE_SIGNING_REQUIRED: NO) Xcode 가 엔타이틀먼트 처리 단계를
        # 통째로 건너뛴다. 그러면 App Group 이 안 붙고, 증상은 "컨테이너 조회가 nil" 로
        # 나타나 DB 가 앱 전용 경로에 생긴다. 시뮬레이터 기본 ad-hoc 서명에 맡긴다.

    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
