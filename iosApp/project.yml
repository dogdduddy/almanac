# XcodeGen 정의. `xcodegen generate` 로 Almanac.xcodeproj 를 만든다.
#
# project.pbxproj 를 손으로 관리하지 않는 이유: 병합 충돌이 잦고 리뷰가 불가능하다.
# 나중에 WidgetKit 익스텐션 타깃을 붙일 때도 여기 몇 줄이면 된다.
#
# 생성물(.xcodeproj)은 커밋하지 않는다 — 이 파일이 진실의 원천이다.

name: Almanac

options:
  bundleIdPrefix: com.dogdduddy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO   # Gradle 을 빌드 페이즈에서 돌려야 한다
    DEVELOPMENT_TEAM: "7NARB43395"       # Apple Developer 배포 팀

targets:
  Almanac:
    type: application
    platform: iOS

    sources:
      - path: Almanac
        excludes:
          - "Resources/**"
          - "Assets.xcassets/**"
      - path: Almanac/Assets.xcassets
        buildPhase: resources
      # content.db. 빌드 페이즈의 syncContent 가 정본에서 복사해 채운다.
      # 커밋되는 건 정본(content/content.db) 하나이고 이 사본은 생성물이다.
      #
      # type: folder 로 두면 안 된다 — Xcode 가 폴더 참조를 중첩 코드 객체로 보고
      # 코드서명 단계에서 "code object is not signed at all" 로 실패한다.
      # 리소스 빌드 페이즈로 명시해야 한다.
      - path: Almanac/Resources
        buildPhase: resources
        optional: true

    info:
      path: Almanac/Info.plist
      properties:
        CFBundleDisplayName: Almanac
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Compose Multiplatform 필수. 없으면 앱이 **시작하자마자 예외로 죽는다**
        # (경고가 아니라 IllegalStateException 이다).
        # 이게 없으면 120Hz 기기에서 60Hz 로 묶여 애니메이션이 눈에 띄게 끊긴다 —
        # 역방향 페이지 넘김이 이 앱의 핵심 연출이므로 특히 중요하다.
        CADisableMinimumFrameDurationOnPhone: true
        # 위치는 선택 사항이다. 거부해도 도시를 직접 고르면 앱이 온전히 동작한다.
        NSLocationWhenInUseUsageDescription: >-
          Almanac uses your location only to look up today's weather,
          so it can find a passage written about the same sky.

    dependencies:
      # 앱이 익스텐션을 품는다. XcodeGen 이 embed 빌드 페이즈를 만들어준다.
      - target: AlmanacWidget

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogdduddy.almanac
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: Almanac/Almanac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComposeApp
          # SQLDelight 의 네이티브 드라이버(sqliter)는 시스템 sqlite3 를 호출만 하고
          # 자기가 품고 있지 않다. 이걸 빼면 링크 단계에서 _sqlite3_* 전부 미해결로 터진다.
          - -lsqlite3
        # 서명을 끄면(CODE_SIGNING_REQUIRED: NO) Xcode 가 엔타이틀먼트 처리 단계를
        # 통째로 건너뛴다. 그러면 App Group 이 안 붙고, 증상은 "컨테이너 조회가 nil" 로
        # 나타나 DB 가 앱 전용 경로에 생긴다. 시뮬레이터 기본 ad-hoc 서명에 맡긴다.

    preBuildScripts:
      - name: Compile Kotlin framework
        # KMP 표준 태스크. Xcode 가 넘겨주는 CONFIGURATION/SDK_NAME/ARCHS 를 읽어
        # 맞는 아키텍처로 빌드하고 결과를 xcode-frameworks 에 놓는다.
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

      - name: Check RevenueCat key (Release)
        # Android 는 assembleRelease/bundleRelease 가 게이트를 물고 있지만, iOS 는
        # Xcode 가 빌드를 주도하므로 여기서 불러줘야 한다. Test Store 키나 자리표시자로
        # 제출하면 SDK 가 프로덕션에서 크래시하고 App Review 에서 반려된다.
        #
        # 위젯 타깃에는 걸지 않는다 — 위젯은 아무것도 팔지 않아 결제 SDK 를 링크하지 않는다.
        script: |
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" = "Release" ]; then
            ./gradlew :composeApp:checkReleaseBillingKeyIos
          fi
        basedOnDependencyAnalysis: false

      - name: Sync content.db
        # 리소스 복사 페이즈보다 먼저 돌아야 한다. 앱과 위젯 번들 양쪽을 채운다 —
        # 익스텐션은 자기 번들만 보므로 한쪽만 채우면 위젯이 구버전 DB 를 든다.
        # 릴리스는 사본이 정본과 다르면 여기서 즉시 실패한다.
        script: |
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" = "Release" ]; then
            ./gradlew verifyContentDb
          else
            ./gradlew syncContent
          fi
        basedOnDependencyAnalysis: false

  AlmanacWidget:
    type: app-extension
    platform: iOS

    sources:
      - path: AlmanacWidget
        excludes:
          - "Resources/**"
      # 위젯은 자기 번들을 본다 (익스텐션의 NSBundle.mainBundle 은 앱 번들이 아니다).
      # content.db 를 여기에도 넣어야 앱을 한 번도 안 열었어도 위젯이 동작한다.
      # 앱 타깃의 Sync content.db 페이즈가 세 번들을 동시에 채운다.
      - path: AlmanacWidget/Resources
        buildPhase: resources
        optional: true

    info:
      path: AlmanacWidget/Info.plist
      properties:
        CFBundleDisplayName: Almanac
        # 앱과 버전이 같아야 한다. 다르면 content.db 복사 판단(버전 스탬프)이
        # 서로 어긋나 앱과 위젯이 번갈아 재복사한다.
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "5"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # 번들 폰트 등록. 없으면 .custom(...) 이 **조용히 시스템 폰트로 폴백**한다 —
        # 에러도 경고도 없어서, 파일만 넣고 여기를 빠뜨리면 원인을 찾기 어렵다.
        UIAppFonts:
          - crimson_text.ttf

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dogdduddy.almanac.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: AlmanacWidget/AlmanacWidget.entitlements
        # 위젯은 Compose 를 링크하지 않는다 — 익스텐션은 메모리 한도가 빡빡한데
        # Compose 를 통째로 들고 갈 이유가 없다. 도메인 로직만 있는 AlmanacKit 이면 된다.
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - AlmanacKit
          - -lsqlite3
        # 서명을 끄면(CODE_SIGNING_REQUIRED: NO) Xcode 가 엔타이틀먼트 처리 단계를
        # 통째로 건너뛴다. 그러면 App Group 이 안 붙고, 증상은 "컨테이너 조회가 nil" 로
        # 나타나 DB 가 앱 전용 경로에 생긴다. 시뮬레이터 기본 ad-hoc 서명에 맡긴다.

    preBuildScripts:
      - name: Compile Kotlin framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false

      # 앱이 익스텐션에 의존하므로 위젯이 **먼저** 빌드된다. 앱 타깃에만 두면
      # 깨끗한 체크아웃의 첫 빌드에서 위젯 번들이 비어 있는 채로 복사 페이즈를 지난다.
      - name: Sync content.db
        script: |
          cd "$SRCROOT/.."
          if [ "$CONFIGURATION" = "Release" ]; then
            ./gradlew verifyContentDb
          else
            ./gradlew syncContent
          fi
        basedOnDependencyAnalysis: false
